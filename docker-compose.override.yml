# Nur in Dev. Wird von `docker compose up` automatisch zusätzlich geladen.
services:
  caddy:
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: clubzweisam.settings.dev
    volumes:
      - ./backend:/app
      - ./docs:/docs
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml:ro
      - static_data:/app/staticfiles
      - ./backend/media:/app/media

  assets:
    command: npm run dev
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
      - ./backend/templates:/backend/templates:ro
      - ./backend/apps:/backend/apps:ro
      - ./backend/static/dist:/frontend/dist

  playwright:
    image: mcr.microsoft.com/playwright/python:v1.49.1-noble
    profiles: ["e2e"]
    working_dir: /tests
    depends_on:
      - caddy
    environment:
      BASE_URL: https://caddy
    volumes:
      - ./tests:/tests
    networks:
      - clubzweisam_net
    command: sh -c "pip install --quiet --no-cache-dir pytest==8.3.4 playwright==1.49.1 && pytest e2e -m e2e -o markers=e2e -p no:cacheprovider -v"