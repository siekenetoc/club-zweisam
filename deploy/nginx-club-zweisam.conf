# Host-nginx für club-zweisam.de
# TLS/ACME auf dem Host; Caddy läuft intern auf 127.0.0.1:8080 und macht
# Basic Auth sowie Security-Header.
#
# www benötigt zunächst einen DNS-A-Record auf 217.154.144.187 und ein Cert
# mit www-SAN; danach wird der www-Serverblock aktiviert.

server {
    listen 80;
    listen [::]:80;
    server_name club-zweisam.de www.club-zweisam.de;

    location /.well-known/acme-challenge/ {
        root /var/lib/certbot;
    }

    location / {
        return 301 https://club-zweisam.de$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name club-zweisam.de;

    ssl_certificate /etc/letsencrypt/live/club-zweisam.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/club-zweisam.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
