[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["clubzweisam", "apps", "core"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "clubzweisam.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers --ds=clubzweisam.settings.test --cov=apps --cov-report=term-missing"
testpaths = ["tests/unit", "tests/integration"]
markers = ["e2e: End-to-End-Test gegen den laufenden Docker-Stack (Playwright)"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]