{% extends "base.html" %}
{% block title %}Inhalt bearbeiten – Verwaltung{% endblock %}
{% block content %}
  <section class="mx-auto max-w-4xl space-y-6">
    <div class="flex items-center justify-between"><h1 class="text-2xl font-semibold">Inhalt bearbeiten</h1><a href="{% url 'admin_panel:content' %}" class="btn-ghost text-xs">Zurück</a></div>
    <form method="post" class="form-card space-y-4">
      {% csrf_token %}
      {{ form.media }}
      {% for field in form %}<div><label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<p class="form-error">{{ error }}</p>{% endfor %}</div>{% endfor %}
      <button type="submit" class="btn-primary">Speichern</button>
    </form>
  </section>
{% endblock %}
